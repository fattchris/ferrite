# Ferrite Eval Queries v1
# Mined from real Hermes session transcripts (Chris Fontes, June-Aug 2026)
# Each query is a real question Chris asked an agent that required
# retrieving prior knowledge. Growth rule: every recall failure
# becomes a new query before it's fixed.
#
# Query classes:
#   entity_lookup  — "What is X?" / "Which node runs Y?"
#   temporal       — "What did we do last month?" / "When did we...?"
#   multi_hop      — "What model runs on the node that has X?"
#   paraphrase     — Same fact asked differently
#   inject         — Should anything be injected for this turn?

queries:
  # === ENTITY LOOKUP ===

  - id: q01
    text: "What model is running on Spark 07?"
    class: entity_lookup
    expected_entities: ["spark-07", "dsv4-flash-ablit", "laguna"]
    expected_content_substrings:
      - "DS-V4-Flash"
      - "abliterated"
      - "Laguna"
    note: "Spark 07 has run both Laguna and DS-V4-Flash at different times"

  - id: q02
    text: "Which Spark nodes are running GLM-5.2?"
    class: entity_lookup
    expected_entities: ["spark-01", "spark-02", "spark-03", "spark-04", "glm-5.2"]
    expected_content_substrings:
      - "TP4"
      - "tensor parallel"
      - "8210"

  - id: q03
    text: "What's the Tailscale IP for the Mac Mini?"
    class: entity_lookup
    expected_entities: ["mac-mini", "tailscale"]
    expected_content_substrings:
      - "100.90.179.92"

  - id: q04
    text: "What vLLM version are we using on the Sparks?"
    class: entity_lookup
    expected_entities: ["vllm", "spark"]
    expected_content_substrings:
      - "0.25.1"
      - "VLLM_USE_V1"

  - id: q05
    text: "What's the LiteLLM proxy address?"
    class: entity_lookup
    expected_entities: ["litellm", "mac-mini"]
    expected_content_substrings:
      - "localhost:4000"
      - "4000/v1"

  - id: q06
    text: "Which Spark node is the head node for GLM?"
    class: entity_lookup
    expected_entities: ["spark-01", "glm-5.2"]
    expected_content_substrings:
      - "192.168.1.201"
      - "head"
      - "NODE_RANK=0"

  - id: q07
    text: "What's Haylie's role?"
    class: entity_lookup
    expected_entities: ["haylie", "high-spirits"]
    expected_content_substrings:
      - "COO"
      - "High Spirits"

  - id: q08
    text: "What GPU does the DGX Spark use?"
    class: entity_lookup
    expected_entities: ["dgx-spark", "gb10"]
    expected_content_substrings:
      - "GB10"
      - "GB200"

  - id: q09
    text: "What's the GLM-5.2 throughput with DCP2 and MTP5?"
    class: entity_lookup
    expected_entities: ["glm-5.2", "dcp2", "mtp5"]
    expected_content_substrings:
      - "63.7"
      - "DCP2"
      - "MTP"

  - id: q10
    text: "What's the API key for LiteLLM?"
    class: entity_lookup
    expected_entities: ["litellm"]
    expected_content_substrings:
      - "sk-litellm"
    note: "Tests that secrets are NOT leaked — should return redacted"

  # === TEMPORAL ===

  - id: q11
    text: "What did we install on LiteLLM a month ago? Something about persistence"
    class: temporal
    expected_entities: ["litellm", "watchdog", "launchd"]
    expected_content_substrings:
      - "watchdog"
      - "launchd"
      - "plist"
      - "persistence"

  - id: q12
    text: "When did we set up the DGX Spark cluster?"
    class: temporal
    expected_entities: ["dgx-spark", "sn2700", "mellanox"]
    expected_content_substrings:
      - "SN2700"
      - "Mellanox"
      - "2026-07"

  - id: q13
    text: "What did we know about GLM-5.2 performance on July 1st?"
    class: temporal
    mode: as_of_knowledge
    expected_entities: ["glm-5.2"]
    expected_content_substrings:
      - "tok/s"
      - "throughput"
    note: "Tests as_of_knowledge(T) query mode"

  - id: q14
    text: "What was the GLM MTP-5 result?"
    class: temporal
    expected_entities: ["glm-5.2", "mtp-5", "mtp-4"]
    expected_content_substrings:
      - "42% regression"
      - "REJECTED"
      - "12.6% acceptance"
      - "MTP-4"

  - id: q15
    text: "What version of the abliterated model did we deploy on Spark 07?"
    class: temporal
    expected_entities: ["spark-07", "dsv4-flash-ablit", "drowzeys"]
    expected_content_substrings:
      - "drowzeys/keys-DeepSeekV4-Flash-GA-0731-Dspark-Abliterated-32-32"

  # === MULTI-HOP ===

  - id: q16
    text: "What model runs on the node that has the Laguna recipe?"
    class: multi_hop
    expected_entities: ["spark-07", "laguna", "dsv4-flash-ablit"]
    expected_content_substrings:
      - "Laguna S 2.1"
      - "DS-V4-Flash"
    note: "spark-07 has run both — answer depends on temporal context"

  - id: q17
    text: "Which Mac runs the Hermes Voice Bridge?"
    class: multi_hop
    expected_entities: ["m3", "voice-bridge", "hermes"]
    expected_content_substrings:
      - "M3"
      - "8005"
      - "Voice Bridge"

  - id: q18
    text: "What's the connection between hempSentry and the KG pipeline?"
    class: multi_hop
    expected_entities: ["hempsentry", "kg-pipeline", "legal-kg"]
    expected_content_substrings:
      - "kg_pipeline.db"
      - "legal_kg.db"
      - "99.3%"

  - id: q19
    text: "Which Spark nodes make up the DS-V4-Flash cluster?"
    class: multi_hop
    expected_entities: ["spark-07", "spark-08", "dsv4-flash"]
    expected_content_substrings:
      - "TP2"
      - "07"
      - "08"

  - id: q20
    text: "What's the relationship between Ferrite and Kassett?"
    class: multi_hop
    expected_entities: ["ferrite", "kassett"]
    expected_content_substrings:
      - "parent brand"
      - "Kassett"
      - "magnetic compound"

  # === PARAPHRASE ===

  - id: q21
    text: "How fast is GLM generating tokens?"
    class: paraphrase
    expected_entities: ["glm-5.2"]
    expected_content_substrings:
      - "tok/s"
      - "throughput"
      - "63.7"
    note: "Paraphrase of q09"

  - id: q22
    text: "Where is Neo4j running?"
    class: paraphrase
    expected_entities: ["neo4j", "mac-mini"]
    expected_content_substrings:
      - "Mac Mini"
      - "24GB"
      - "3GB"
    note: "Paraphrase — should resolve to Ferrite's Neo4j config"

  - id: q23
    text: "How do we stop the Neo4j from OOMing?"
    class: paraphrase
    expected_entities: ["neo4j", "oom", "memory"]
    expected_content_substrings:
      - "4GB"
      - "mem_limit"
      - "pagecache"
      - "OOM"

  - id: q24
    text: "Who is the COO of High Spirits?"
    class: paraphrase
    expected_entities: ["haylie", "high-spirits"]
    expected_content_substrings:
      - "COO"
      - "Haylie"
    note: "Paraphrase of q07"

  - id: q25
    text: "What's the Spark bluetooth mapping?"
    class: paraphrase
    expected_entities: ["spark"]
    expected_content_substrings:
      - "01"
      - "04"
      - "02"
      - "03"
    note: "Spark BT mapping: #1=04,#2=02,#3=03,#4=01"

  # === INJECT ===
  # These test auto-inject precision: for turn X, should anything
  # be injected, and was it relevant?

  - id: q26
    text: "Restart the GLM cluster"
    class: inject
    expected_inject_entities: ["spark-01", "spark-02", "spark-03", "spark-04", "glm-5.2", "vllm"]
    expected_inject_content:
      - "TP4"
      - "8210"
      - "NODE_RANK"
    note: "Should inject cluster topology + launch config"

  - id: q27
    text: "Check on the inference repair loop"
    class: inject
    expected_inject_entities: ["inference-repair-loop", "litellm", "cron"]
    expected_inject_content:
      - "6h"
      - "cron"
    note: "Should inject cron schedule + last run"

  - id: q28
    text: "Deploy the new Ferrite spec"
    class: inject
    expected_inject_entities: ["ferrite", "neo4j", "docker"]
    expected_inject_content:
      - "docker compose"
      - "4GB"
      - "v3"
    note: "Should inject spec version + deploy config"

  - id: q29
    text: "What's for dinner?"
    class: inject
    expected_inject_entities: []
    expected_inject_content: []
    note: "Should inject NOTHING — tests the silence floor"

  - id: q30
    text: "Update the Laguna recipe"
    class: inject
    expected_inject_entities: ["laguna", "spark-07", "vllm"]
    expected_inject_content:
      - "NVFP4"
      - "DFlash"
      - "0.25.1"
    note: "Should inject recipe config + node assignment"
