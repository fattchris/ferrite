# Ferrite Eval Query Corpus (§13.2, P-6 fix)
#
# 30+ queries mined from real session history patterns.
# Each query has: text, expected_entity_ids and/or expected_substrings,
# and a class for categorization.
#
# The set only grows — every real-world recall failure becomes a new query.

queries:
  # --- Entity lookup (direct name match) ---
  - text: "GLM"
    expected_entity_ids: ["e2e-glm"]
    expected_substrings: ["GLM-5.2", "language model"]
    class: entity_lookup

  - text: "DGX Spark"
    expected_entity_ids: ["e2e-spark"]
    expected_substrings: ["DGX Spark", "GB10", "NVIDIA"]
    class: entity_lookup

  - text: "Spark Cluster"
    expected_entity_ids: ["e2e-cluster"]
    expected_substrings: ["Spark Cluster", "8-node"]
    class: entity_lookup

  # --- Paraphrase (semantic, not lexical) ---
  - text: "large language model"
    expected_substrings: ["GLM", "model"]
    class: paraphrase

  - text: "AI inference hardware"
    expected_substrings: ["Spark", "DGX", "GPU"]
    class: paraphrase

  - text: "compute node for ML"
    expected_substrings: ["Spark", "DGX"]
    class: paraphrase

  - text: "generative AI system"
    expected_substrings: ["GLM", "model"]
    class: paraphrase

  # --- Multi-hop (entity → fact → related entity) ---
  - text: "what runs on the Spark cluster"
    expected_substrings: ["GLM", "inference"]
    class: multi_hop

  - text: "what models are deployed"
    expected_substrings: ["GLM", "model"]
    class: multi_hop

  - text: "GPU hardware in the cluster"
    expected_substrings: ["Spark", "GPU", "GB10"]
    class: multi_hop

  # --- Temporal (recency-sensitive) ---
  - text: "latest cluster status"
    expected_substrings: ["Spark", "cluster"]
    class: temporal

  - text: "recent model deployment"
    expected_substrings: ["GLM", "deploy"]
    class: temporal

  # --- Inject (exact content match) ---
  - text: "DGX Spark GB10 node"
    expected_substrings: ["DGX Spark", "GB10"]
    class: inject

  - text: "Large language model"
    expected_substrings: ["GLM-5.2", "language model"]
    class: inject

  - text: "8-node DGX Spark cluster"
    expected_substrings: ["8-node", "cluster"]
    class: inject

  # --- Edge cases (fuzzy/partial) ---
  - text: "spark"
    expected_substrings: ["Spark", "DGX"]
    class: entity_lookup

  - text: "glm"
    expected_substrings: ["GLM", "model"]
    class: entity_lookup

  - text: "cluster nodes"
    expected_substrings: ["cluster", "Spark"]
    class: entity_lookup

  # --- Broader semantic ---
  - text: "NVIDIA hardware"
    expected_substrings: ["DGX", "NVIDIA", "Spark"]
    class: paraphrase

  - text: "machine learning infrastructure"
    expected_substrings: ["Spark", "cluster", "DGX"]
    class: paraphrase

  - text: "AI model serving"
    expected_substrings: ["GLM", "model", "inference"]
    class: paraphrase

  - text: "inference endpoint"
    expected_substrings: ["GLM", "model", "Spark"]
    class: paraphrase

  # --- Negative cases (should return results but maybe not exact) ---
  - text: " Kubernetes"
    expected_substrings: []
    class: entity_lookup

  - text: "database configuration"
    expected_substrings: []
    class: entity_lookup

  # --- Compound queries ---
  - text: "GLM on Spark cluster"
    expected_entity_ids: ["e2e-glm", "e2e-spark", "e2e-cluster"]
    expected_substrings: ["GLM", "Spark"]
    class: multi_hop

  - text: "DGX Spark running inference"
    expected_substrings: ["DGX", "Spark", "inference"]
    class: multi_hop

  - text: "GLM model on DGX hardware"
    expected_substrings: ["GLM", "DGX"]
    class: multi_hop

  # --- Additional coverage ---
  - text: "GPU acceleration"
    expected_substrings: ["GPU", "Spark", "GB10"]
    class: paraphrase

  - text: "model deployment on cluster"
    expected_substrings: ["GLM", "model", "cluster"]
    class: multi_hop

  - text: "NVIDIA DGX"
    expected_substrings: ["DGX", "NVIDIA", "Spark"]
    class: entity_lookup

  - text: "language model inference"
    expected_substrings: ["GLM", "model", "inference"]
    class: paraphrase

  - text: "cluster infrastructure"
    expected_substrings: ["cluster", "Spark", "8-node"]
    class: paraphrase

  - text: "AI system on DGX"
    expected_substrings: ["GLM", "DGX"]
    class: multi_hop
