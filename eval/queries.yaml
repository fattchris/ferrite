# Ferrite Eval Queries (A5)
#
# Each query has:
#   text: The search query text
#   class: entity_lookup | temporal | multi_hop | paraphrase | inject
#   expected_entity_ids: List of entity names that should appear in results
#   expected_substrings: List of substrings that should appear in any result
#
# Growth rule: every real-world recall failure becomes a new eval query
# before it's fixed. The set only grows.

queries:
  # --- Entity lookup (basic) ---
  - text: "spark-01"
    class: entity_lookup
    expected_entity_ids: ["spark-01"]
    expected_substrings: ["spark-01"]

  - text: "what runs on spark-01"
    class: entity_lookup
    expected_entity_ids: ["spark-01", "glm-5.2"]
    expected_substrings: ["runs_on", "glm-5.2"]

  - text: "GLM-5.2 deployment"
    class: entity_lookup
    expected_entity_ids: ["glm-5.2"]
    expected_substrings: ["glm-5.2"]

  - text: "litellm proxy"
    class: entity_lookup
    expected_entity_ids: ["litellm"]
    expected_substrings: ["litellm"]

  - text: "tailscale network"
    class: entity_lookup
    expected_entity_ids: ["tailscale"]
    expected_substrings: ["tailscale"]

  - text: "hempsentry"
    class: entity_lookup
    expected_entity_ids: ["hempsentry"]
    expected_substrings: ["hempsentry"]

  - text: "neo4j database"
    class: entity_lookup
    expected_entity_ids: ["neo4j"]
    expected_substrings: ["neo4j"]

  - text: "docker containers"
    class: entity_lookup
    expected_entity_ids: ["docker"]
    expected_substrings: ["docker"]

  - text: "redis cache"
    class: entity_lookup
    expected_entity_ids: ["redis"]
    expected_substrings: ["redis"]

  - text: "ollama embeddings"
    class: entity_lookup
    expected_entity_ids: ["ollama"]
    expected_substrings: ["ollama"]

  # --- Temporal ---
  - text: "changes last week"
    class: temporal
    expected_entity_ids: []
    expected_substrings: []

  - text: "deployments in june"
    class: temporal
    expected_entity_ids: []
    expected_substrings: []

  - text: "last spring deployment"
    class: temporal
    expected_entity_ids: []
    expected_substrings: []

  - text: "2026-08 deployment"
    class: temporal
    expected_entity_ids: []
    expected_substrings: []

  # --- Multi-hop ---
  - text: "what clusters are connected to spark-01"
    class: multi_hop
    expected_entity_ids: ["spark-01"]
    expected_substrings: []

  - text: "what models are related to GLM-5.2"
    class: multi_hop
    expected_entity_ids: ["glm-5.2"]
    expected_substrings: []

  - text: "infrastructure connected to mac-mini"
    class: multi_hop
    expected_entity_ids: ["mac-mini"]
    expected_substrings: []

  # --- Paraphrase ---
  - text: "what GPUs are we running"
    class: paraphrase
    expected_entity_ids: []
    expected_substrings: ["gpu", "spark"]

  - text: "how is the model inference configured"
    class: paraphrase
    expected_entity_ids: []
    expected_substrings: ["vllm", "litellm"]

  - text: "home automation setup"
    class: paraphrase
    expected_entity_ids: []
    expected_substrings: ["home assistant", "ha"]

  # --- Inject (should something be injected?) ---
  - text: "restart the cluster"
    class: inject
    expected_entity_ids: []
    expected_substrings: ["spark", "cluster"]

  - text: "check the inference endpoint"
    class: inject
    expected_entity_ids: []
    expected_substrings: ["litellm", "vllm"]

  - text: "what's the ferrite graph status"
    class: inject
    expected_entity_ids: ["ferrite"]
    expected_substrings: ["ferrite", "neo4j"]

  - text: "update the hempSentry extraction"
    class: inject
    expected_entity_ids: ["hempsentry"]
    expected_substrings: ["hempsentry"]

  - text: "fix the voice bridge"
    class: inject
    expected_entity_ids: []
    expected_substrings: ["voice"]

  - text: "check laguna deployment"
    class: inject
    expected_entity_ids: []
    expected_substrings: ["laguna"]

  - text: "DSV4 flash nodes"
    class: inject
    expected_entity_ids: []
    expected_substrings: ["dsv4", "spark-07", "spark-08"]

  - text: "is the backup working"
    class: inject
    expected_entity_ids: []
    expected_substrings: ["backup"]

  - text: "check tailscale connectivity"
    class: inject
    expected_entity_ids: ["tailscale"]
    expected_substrings: ["tailscale"]

  - text: "what version is GLM"
    class: entity_lookup
    expected_entity_ids: ["glm-5.2"]
    expected_substrings: ["version", "glm"]
