services:
  neo4j:
    image: neo4j:5-community
    container_name: ferrite-neo4j
    ports:
      - "7474:7474"   # Browser
      - "7687:7687"   # Bolt
    volumes:
      - neo4j_data:/data
    environment:
      - NEO4J_AUTH=neo4j/ferrite123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_server_memory_heap_initial__size=1G
      - NEO4J_server_memory_heap_max__size=1G
      - NEO4J_server_memory_pagecache_size=1G
      - NEO4J_dbms_memory_transaction_total_max=256M
    mem_limit: 4g
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ferrite123 'RETURN 1' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:8
    container_name: ferrite-redis
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  ferrite-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ferrite-api
    ports:
      - "8001:8001"   # REST API
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=ferrite123
      - REDIS_URL=redis://redis:6379/0
      - LLM_BASE_URL=http://host.docker.internal:4000/v1
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=glm-5.2
      - EMBEDDING_MODEL=nomic-embed-text
      - FERRITE_API_KEY=${FERRITE_API_KEY:-}
    volumes:
      - ferrite_api_data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  neo4j_data:
  redis_data:
  ferrite_api_data:
