# Production Docker Compose for Ferrite
# Includes Caddy TLS termination, Redis AOF persistence,
# resource limits, and secret management.
#
# Usage:
#   cp .env.example .env  # edit secrets
#   docker compose -f docker-compose.prod.yml up -d

services:
  caddy:
    image: caddy:2-alpine
    container_name: ferrite-caddy
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      ferrite-api:
        condition: service_healthy

  neo4j:
    image: neo4j:5.20-community
    container_name: ferrite-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    environment:
      # Password from .env (no plaintext in compose)
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_server_memory_heap_initial__size=1G
      - NEO4J_server_memory_heap_max__size=1G
      - NEO4J_server_memory_pagecache_size=1G
      - NEO4J_dbms_memory_transaction_total_max=256M
    mem_limit: 4g
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD} 'RETURN 1' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - ferrite_net

  redis:
    image: redis:8
    container_name: ferrite-redis
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    # AOF persistence: fsync every 1s (§9, P-2 fix)
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --auto-aof-rewrite-percentage 100
      --auto-aof-rewrite-min-size 64mb
      --save 900 1
      --save 300 10
      --save 60 10000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ferrite_net

  ferrite-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ferrite-api
    ports:
      - "8001:8001"
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - REDIS_URL=redis://redis:6379/0
      - LLM_BASE_URL=http://host.docker.internal:4000/v1
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=glm-5.2
      - EMBEDDING_MODEL=nomic-embed-text
      - FERRITE_API_KEY=${FERRITE_API_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ferrite_api_data:/app/data
      - ferrite_file_repo:/app/data/files
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    mem_limit: 2g
    # Structured JSON logs → stderr → Docker json-file driver with rotation.
    # Host-side: `docker logs ferrite-api` or `scripts/logs.sh`
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ferrite_net

  prometheus:
    image: prom/prometheus:latest
    container_name: ferrite-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - ferrite_net

volumes:
  neo4j_data:
  redis_data:
  ferrite_api_data:
  ferrite_file_repo:
  caddy_data:
  caddy_config:
  prometheus_data:

networks:
  ferrite_net:
    driver: bridge
