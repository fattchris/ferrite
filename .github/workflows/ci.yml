# Ferrite CI Pipeline (P-7 fix)
#
# Gates:
# 1. Lint (ruff)
# 2. Unit tests (pytest)
# 3. Namespace CI test (no raw MATCH in handlers)
# 4. E2E tests (requires running services)
# 5. Recall gate (recall@5 >= 0.30)
# 6. Load test (p95 < 500ms, error rate < 10%)
#
# Usage: .github/workflows/ci.yml or run locally:
#   python scripts/ci_pipeline.py

name: Ferrite CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run ruff check src/ tests/

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run pytest tests/ -q --tb=short

  namespace-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run pytest tests/test_namespace_ci.py -v

  check_raw_match:
    name: Ban raw MATCH Cypher in handler code (§6.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      # §6.3: all Cypher must go through the query builder (query.py) that
      # injects namespace filters. Raw MATCH strings in handler modules are
      # banned. Builder modules where Cypher construction is sanctioned are
      # excluded below; everything else must not inline a MATCH clause.
      - name: Grep for raw MATCH in handler modules
        run: |
          set -o pipefail
          if grep -rnE "['\"]MATCH[[:space:]]*\(" src/ferrite/*.py \
            | grep -vE 'query\.py|temporal\.py|ingestion\.py|consolidator\.py|mental_models\.py|canonicalize\.py|vector_store\.py|mcp_server\.py|eval\.py|schema\.py|observability\.py|tempr\.py'; then
            echo "::error::Raw MATCH Cypher found in handler code (§6.3 violation)"
            exit 1
          else
            echo "OK: no raw MATCH in handler code"
          fi
      - name: Pytest replica of the grep check
        run: uv run pytest -q --tb=short -k grep

  integration:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/test-password
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p test-password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: test-password
          REDIS_URL: redis://localhost:6379/0
          FERRITE_API_KEY: ci-test-key
        run: |
          # Start API in background
          uv run uvicorn src.ferrite.api:app --host 0.0.0.0 --port 8001 &
          sleep 5
          # Run E2E
          uv run python scripts/e2e_test.py
      - env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: test-password
          REDIS_URL: redis://localhost:6379/0
          FERRITE_API_KEY: ci-test-key
        run: |
          # Recall gate (§13.2)
          uv run python -c "
          from src.ferrite.eval import run_eval
          from neo4j import GraphDatabase
          driver = GraphDatabase.driver('bolt://localhost:7687', auth=('neo4j', 'test-password'))
          result = run_eval(driver)
          recall5 = result.get('recall', {}).get('recall@5', 0)
          print(f'Recall@5: {recall5}')
          assert recall5 >= 0.30, f'RECALL GATE FAILED: {recall5} < 0.30'
          print('RECALL GATE PASSED')
          "
