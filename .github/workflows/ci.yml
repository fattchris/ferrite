name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --dev
      - run: uv run ruff check src/ tests/ scripts/

  test:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5-community
        ports: ["7474:7474", "7687:7687"]
        env:
          NEO4J_AUTH: neo4j/ferrite123
          NEO4J_PLUGINS: '["apoc"]'
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ferrite123 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --dev
      - run: |
          uv run python -c "
          from neo4j import GraphDatabase
          from ferrite.schema import init_schema
          d = GraphDatabase.driver('bolt://localhost:7687', auth=('neo4j', 'ferrite123'))
          init_schema(d)
          d.close()
          "
      - env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: ferrite123
          REDIS_URL: redis://localhost:6379
        run: uv run pytest -v --tb=short

  e2e:
    runs-on: ubuntu-latest
    needs: [lint, test]
    services:
      neo4j:
        image: neo4j:5-community
        ports: ["7474:7474", "7687:7687"]
        env:
          NEO4J_AUTH: neo4j/ferrite123
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ferrite123 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
      - run: |
          uv run python -c "
          from neo4j import GraphDatabase
          from ferrite.schema import init_schema
          d = GraphDatabase.driver('bolt://localhost:7687', auth=('neo4j', 'ferrite123'))
          init_schema(d)
          d.close()
          "
      - name: Start API
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: ferrite123
          REDIS_URL: redis://localhost:6379
          FERRITE_API_KEY: test-secret
        run: |
          uv run uvicorn ferrite.api:app --host 0.0.0.0 --port 8001 &
          sleep 5
      - env:
          FERRITE_NEO4J_PASSWORD: ferrite123
          FERRITE_API_KEY: test-secret
        run: uv run python scripts/e2e_test.py

  eval:
    runs-on: ubuntu-latest
    needs: [test]
    services:
      neo4j:
        image: neo4j:5-community
        ports: ["7474:7474", "7687:7687"]
        env:
          NEO4J_AUTH: neo4j/ferrite123
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ferrite123 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
      - run: |
          uv run python -c "
          from neo4j import GraphDatabase
          from ferrite.schema import init_schema
          d = GraphDatabase.driver('bolt://localhost:7687', auth=('neo4j', 'ferrite123'))
          init_schema(d)
          d.close()
          "
      - name: Run eval harness
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: ferrite123
        run: |
          uv run python -c "
          from neo4j import GraphDatabase
          from ferrite.eval import run_eval, health_check
          h = health_check()
          assert h['status'] == 'ok', f'Eval not ready: {h}'
          d = GraphDatabase.driver('bolt://localhost:7687', auth=('neo4j', 'ferrite123'))
          result = run_eval(d)
          print(f'Recall@5: {result[\"recall\"]}')
          print(f'MRR: {result[\"mrr\"]}')
          # Gate: recall must not regress below 0.30
          assert result['recall'] >= 0.30, f'Recall regression: {result[\"recall\"]}'
          d.close()
          "
