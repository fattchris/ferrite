[project]
name = "ferrite"
version = "0.1.0"
description = "Temporal knowledge graph memory system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]",
    "neo4j>=5.0",
    "redis>=5.0",
    "pydantic>=2.0",
    "httpx",
    "numpy",
    "openai",
    "pyyaml>=6.0.3",
    "mcp>=1.27.2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/seed.py" = ["E501"]
"scripts/eval.py" = ["E501"]
