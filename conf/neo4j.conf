# Ferrite Neo4j 5.x custom config
# Strict validation disabled to allow tx_log rotation tuning
server.config.strict_validation.enabled=false

# Transaction log retention: prune after 1 day or 256M
db.tx_log.rotation.retention_policy=1 days 256M

# Memory (also set via env vars, but conf is authoritative)
server.memory.heap.initial_size=2g
server.memory.heap.max_size=2g
server.memory.pagecache.size=1g
dbms.memory.transaction.total.max=512M

dbms.security.procedures.unrestricted=apoc.*

server.default_listen_address=0.0.0.0
