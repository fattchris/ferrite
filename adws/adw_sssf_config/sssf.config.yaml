# sssf.config.yaml — Ferrite build roster
# All agents use litellm backend (direct LLM API, no file access)
# Files are written by the ADW script from the builder's JSON output

defaults:
  coding_agent: litellm
  model: litellm/glm-5.2
  thinking: medium
  color: ""
  tools: []
  harness_engineering: []

agents:
  # Architect — GLM-5.2. Heavy reasoning, plans the architecture.
  - name: planner
    coding_agent: litellm
    model: litellm/glm-5.2
    thinking: high
    color: "#60a5fa"
    purpose: "Read the Ferrite spec and produce implementation plans for the builder."
    tools: []
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/planner/system.md
      user: adws/adw_data/prompt_engineering/planner/user.md

  # Reviewer — GLM-5.2 reviews builder output against the spec.
  - name: reviewer
    coding_agent: litellm
    model: litellm/glm-5.2
    thinking: high
    color: "#f87171"
    purpose: "Review changed files against the Ferrite spec; approve or reject with specific fixes."
    tools: []
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/reviewer/system.md
      user: adws/adw_data/prompt_engineering/reviewer/user.md

  # Implementer — GLM-5.2. Outputs file contents as JSON in notes_for_next_agent.
  - name: builder
    coding_agent: litellm
    model: litellm/glm-5.2
    thinking: medium
    color: "#4ade80"
    purpose: "Implement the Ferrite MVP from the spec: output file contents as JSON."
    tools: []
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/builder/system.md
      user: adws/adw_data/prompt_engineering/builder/user.md

  # Scout — GLM-5.2. Light recon.
  - name: scout
    coding_agent: litellm
    model: litellm/glm-5.2
    thinking: low
    color: "#fbbf24"
    purpose: "Answer questions about the codebase from context provided in the prompt."
    tools: []
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/scout/system.md
      user: adws/adw_data/prompt_engineering/scout/user.md

  # Documenter — GLM-5.2 for docs
  - name: documenter
    coding_agent: litellm
    model: litellm/glm-5.2
    thinking: low
    color: "#a78bfa"
    purpose: "Write docs and changelogs based on what changed."
    tools: []
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/documenter/system.md
      user: adws/adw_data/prompt_engineering/documenter/user.md
